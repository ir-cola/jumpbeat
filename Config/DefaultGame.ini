; ★Stair/UI のマテリアルとテクスチャは、C++ から
;   LoadObject でパス直指定して読んでいる。
;   ハード参照が無いのでクッカーが存在に気づけず、
;   パッケージに含まれないままになる。
;   （その結果、ロゴが出ない・サークルワイプが機能しない、が起きた）
+DirectoriesToAlwaysCook=(Path="/Game/Stair/UI")

; ★レベルも同じ理由で漏れる。
;   OpenLevel("L_Game") は文字列なので参照として辿れず、
;   既定マップの L_Title しかクックされていなかった。
;   その結果、曲を選んでもレベルを開けずタイトルに戻されていた。
;   レベルは DirectoriesToAlwaysCook では拾われないので、
;   MapsToCook に1つずつ並べる必要がある。
+MapsToCook=(FilePath="/Game/Maps/L_Title")
+MapsToCook=(FilePath="/Game/Maps/L_Game")
